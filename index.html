<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Finanzas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Mis Finanzas</h1>
      <p>Organiza tus ingresos y gastos</p>
      <button id="boton-salir" class="boton-salir hidden" type="button">Cerrar sesión</button>
    </header>

    <section id="pantalla-login" class="panel">
      <h2>Entrar</h2>
      <p class="ayuda">Escribe tu correo y te enviamos un código de 6 dígitos.</p>

      <form id="form-email">
        <div class="campo">
          <label for="email">Correo</label>
          <input type="email" id="email" placeholder="tu@correo.com" required>
        </div>
        <button type="submit">Enviar código</button>
      </form>

      <form id="form-codigo" class="hidden">
        <div class="campo">
          <label for="codigo">Código</label>
          <input type="text" id="codigo" inputmode="numeric" maxlength="6" placeholder="123456" required>
        </div>
        <button type="submit">Entrar</button>
      </form>

      <p id="login-mensaje" class="mensaje"></p>
    </section>

    <div id="app" class="hidden">
      <section class="resumen">
        <div class="tarjeta">
          <span class="etiqueta">Balance</span>
          <strong id="balance">$0.00</strong>
        </div>
        <div class="tarjeta ingreso">
          <span class="etiqueta">Ingresos</span>
          <strong id="total-ingresos">$0.00</strong>
        </div>
        <div class="tarjeta gasto">
          <span class="etiqueta">Gastos</span>
          <strong id="total-gastos">$0.00</strong>
        </div>
      </section>

      <section class="panel">
        <h2>Nuevo movimiento</h2>
        <form id="form-movimiento">
          <div class="campo">
            <label for="descripcion">Descripción</label>
            <input type="text" id="descripcion" placeholder="Ej. Supermercado" required>
          </div>

          <div class="campo">
            <label for="monto">Monto</label>
            <input type="number" id="monto" min="0.01" step="0.01" placeholder="0.00" required>
          </div>

          <div class="campo">
            <label for="tipo">Tipo</label>
            <select id="tipo" required>
              <option value="ingreso">Ingreso</option>
              <option value="gasto">Gasto</option>
            </select>
          </div>

          <div class="campo">
            <label for="categoria">Categoría</label>
            <select id="categoria" required>
              <option value="salario">Salario</option>
              <option value="comida">Comida</option>
              <option value="transporte">Transporte</option>
              <option value="servicios">Servicios</option>
              <option value="entretenimiento">Entretenimiento</option>
              <option value="otro">Otro</option>
            </select>
          </div>

          <div class="campo">
            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" required>
          </div>

          <button type="submit">Agregar</button>
        </form>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Movimientos</h2>
          <select id="filtro-mes">
            <option value="todos">Todos los meses</option>
          </select>
        </div>

        <p id="vacio" class="vacio">Aún no hay movimientos. Agrega el primero.</p>

        <ul id="lista-movimientos"></ul>
      </section>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
